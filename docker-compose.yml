name: alternance-hunter
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hunter
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5436:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hunter -d hunter"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      SERVER_PORT: "8099"
      DB_URL: jdbc:postgresql://postgres:5432/hunter
      DB_USER: hunter
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports: ["127.0.0.1:8099:8099"]
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
